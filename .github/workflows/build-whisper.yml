# Builds whisper-cli at the version pinned in config.example.sh and publishes it as a
# release, so install.sh can download it instead of every Mac needing Homebrew.
# The build itself is tools/build-whisper.sh, which can also be run by hand.
#
# Run by hand: Actions → Build whisper-cli → Run workflow. Then copy the SHA-256 from
# the run summary into WHISPER_CLI_SHA256 in config.example.sh and push.
name: Build whisper-cli

on:
  workflow_dispatch:

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  build:
    runs-on: macos-15  # Apple silicon
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned version
        id: pin
        run: |
          version="$(sed -n 's/^WHISPER_CPP_VERSION="\(.*\)"/\1/p' config.example.sh)"
          [ -n "$version" ] || { echo "::error::Couldn't read WHISPER_CPP_VERSION from config.example.sh"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=whisper-cli-$version" >> "$GITHUB_OUTPUT"

      # A published release is never replaced: install.sh pins its SHA-256, so a
      # rebuilt file with a different fingerprint would fail every install.
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.pin.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.pin.outputs.tag }} already exists. Change WHISPER_CPP_VERSION to build a different version."
            exit 1
          fi

      - name: Build
        run: tools/build-whisper.sh "${{ steps.pin.outputs.version }}" dist

      # install.sh supports Apple silicon on macOS 14.2+; check the file matches
      # and does the jobs meetingrec gives it.
      - name: Check the binary
        run: |
          tools/check-binary.sh dist/whisper-cli
          dist/whisper-cli --help 2>&1 | grep -q -- "--output-srt" || { echo "::error::whisper-cli doesn't run"; exit 1; }

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/whisper-cli

      - name: Publish the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sum="$(shasum -a 256 dist/whisper-cli | cut -d' ' -f1)"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
          gh release create "${{ steps.pin.outputs.tag }}" dist/whisper-cli dist/LICENSE-whisper.cpp.txt \
            --target "$GITHUB_SHA" \
            --title "whisper-cli ${{ steps.pin.outputs.version }}" \
            --notes "whisper-cli built unmodified from [whisper.cpp ${{ steps.pin.outputs.version }}](https://github.com/ggml-org/whisper.cpp/tree/${{ steps.pin.outputs.version }}) for Apple silicon, macOS 14.2 or later, with Metal (GPU) support built in. MIT licence: see LICENSE-whisper.cpp.txt.

          SHA-256 of \`whisper-cli\`: \`$sum\`

          Check where it came from: \`gh attestation verify whisper-cli --repo ${{ github.repository }}\`"

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## whisper-cli ${{ steps.pin.outputs.version }} published

          Put this line in \`config.example.sh\`, then commit and push:

          \`\`\`
          WHISPER_CLI_SHA256="${{ steps.release.outputs.sum }}"
          \`\`\`
          SUMMARY
